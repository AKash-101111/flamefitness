<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile viewport - prevent zoom on input focus on iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Flame Fitness Studio — Ultra Premium Luxury Gym in Chennai. Elite training, world-class equipment, expert trainers. Transform your body and mind." />

    <!-- Theme & PWA colors -->
    <meta name="theme-color" content="#FFD700" />
    <meta name="background-color" content="#050505" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" href="/images/logoflame.jpeg" type="image/jpeg" />

    <!-- Apple / iOS PWA meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flame Gym" />
    <link rel="apple-touch-icon" href="/images/logoflame.jpeg" />

    <!-- Microsoft / Windows -->
    <meta name="msapplication-TileColor" content="#050505" />
    <meta name="msapplication-TileImage" content="/images/logoflame.jpeg" />

    <!-- Prevent horizontal scroll on all mobile browsers -->
    <style>
      html, body { overflow-x: hidden; max-width: 100vw; }
      /* Prevent iOS bounce scroll from showing white edges */
      body { background-color: #050505; }
    </style>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Michroma&family=League+Spartan:wght@300;400;500;600;700;800;900&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Poiret+One&display=swap" rel="stylesheet" />

    <title>Flame Fitness Studio — Train Elite. Become Unstoppable.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => console.log('[SW] Registered, scope:', reg.scope))
            .catch((err) => console.warn('[SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>

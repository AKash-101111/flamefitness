    <style>
      html, body { 
        overflow-x: hidden; 
        max-width: 100vw; 
        background-color: #050505;
        margin: 0;
        padding: 0;
      }
      
      #initial-loader {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: #050505;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
      }

      .loader-logo {
        width: 120px;
        height: 120px;
        margin-bottom: 30px;
        animation: logoPulse 2s ease-in-out infinite;
        filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.4));
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 0, 0, 0.1);
        border-top-color: #FF0000;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes logoPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.2)); }
        50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 30px rgba(255, 0, 0, 0.6)); }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Michroma&family=League+Spartan:wght@300;400;500;600;700;800;900&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Poiret+One&display=swap" rel="stylesheet" />

    <title>Flame Fitness Studio — Train Elite. Become Unstoppable.</title>

        },

          "latitude": 13.0418,
          "longitude": 80.2341
        },

        },

        ],

      }
    </script>
  </head>
  <body>
    <div id="initial-loader">
      <img src="/images/flamelogo.svg" class="loader-logo" alt="Flame Fitness">
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Function to hide the loader with a smooth fade
      window.hideInitialLoader = () => {
        const loader = document.getElementById('initial-loader');
        if (loader && loader.style.visibility !== 'hidden') {
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.style.visibility = 'hidden';
            loader.style.display = 'none';
          }, 800);
        }
      };

      // Fallback: hide loader after 5 seconds if React fails to signal
      setTimeout(window.hideInitialLoader, 5000);
      
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          
          if (isLocalhost) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (let registration of registrations) {
                registration.unregister();
              }
            });
          } else {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .catch((err) => console.warn('[SW] Registration failed:', err));
          }
        });
      }
    </script>
  </body>
